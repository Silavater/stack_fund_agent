name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies (locked)
        run: uv sync --locked

      - name: Ruff (lint + format check)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Architecture firewall (import-linter)
        # Fails if L4/L5 import the L3 crowd side-rail (or ContrarianSignal),
        # or if the deterministic trunk imports upward.
        run: uv run lint-imports

      - name: Tests (incl. firewall import-graph + schema validation)
        run: uv run pytest -q

  docker-build:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build deterministic core image (load locally, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.core
          load: true
          tags: stackfund-core:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image (zero network)
        run: docker run --rm --network none stackfund-core:${{ github.sha }} pipeline

      # --- Optional: Trivy image scan -------------------------------------
      # SECURITY: after the 2026-03-19 trivy-action supply-chain compromise, pin
      # third-party Actions by FULL commit SHA. Resolve once, then uncomment:
      #   gh api repos/aquasecurity/trivy-action/git/refs/tags/v0.35.0 --jq .object.sha
      #
      # - name: Trivy scan (HIGH/CRITICAL -> fail)
      #   uses: aquasecurity/trivy-action@<PINNED_SHA_FOR_v0.35.0>
      #   with:
      #     image-ref: stackfund-core:${{ github.sha }}
      #     severity: HIGH,CRITICAL
      #     exit-code: '1'
      #     ignore-unfixed: true
