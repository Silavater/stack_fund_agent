# Default-deny forward proxy. Only the allowlisted destinations are reachable;
# everything else is denied. This is the demo-able "agent can only talk to the
# few hosts we permit" control (mirrors OpenShell's L7 egress policy).
http_port 3128

# Allowlist — extend as needed (Stripe earn/spend, your LLM/inference host).
acl allowed_dsts dstdomain api.stripe.com mcp.stripe.com
acl allowed_dsts dstdomain .openai.com .anthropic.com
acl allowed_dsts dstdomain integrate.api.nvidia.com
acl SSL_ports port 443
acl CONNECT method CONNECT

http_access deny CONNECT !SSL_ports
http_access allow allowed_dsts
http_access deny all

access_log stdio:/dev/stdout
cache deny all
